services:
  backend:
    build:
      context: ./back
    container_name: depotflow-backend
    environment:
      DOCKER: "1"
      DB_PATH: /app/shed_data/shed.db
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      NOTIFICATION_THRESHOLD_DAYS: ${NOTIFICATION_THRESHOLD_DAYS:-7}
      ADMIN_USER_EMAIL: ${ADMIN_USER_EMAIL:-}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-}
      ADMIN_USER_NAME: ${ADMIN_USER_NAME:-Admin}
      ADMIN_USER_SURNAME: ${ADMIN_USER_SURNAME:-Sistema}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-cambia-esta-clave-whatsapp}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_N8N_WEBHOOK_URL: ${TELEGRAM_N8N_WEBHOOK_URL:-}
    volumes:
      - ./shed_data:/app/shed_data
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./front/sistema-stock
    args:
      VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: depotflow-frontend
    ports:
      - "8084:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
