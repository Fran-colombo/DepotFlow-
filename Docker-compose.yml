version: "3.8"

services:
  backend:
    build:
      context: ./back
    container_name: backend
    environment:
      DOCKER: "1"
      DB_PATH: /app/shed_data/shed.db
      SECRET_KEY: ${SECRET_KEY:-cambia-esta-clave-en-produccion}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      NOTIFICATION_THRESHOLD_DAYS: ${NOTIFICATION_THRESHOLD_DAYS:-7}
    volumes:
      - ./shed_data:/app/shed_data
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./front/sistema-stock
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
